name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pi-digby

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Covers both push and workflow_dispatch — a fresh fork has nothing to push,
    # so "Run workflow" is the natural first deploy.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/pi-digby-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate and sync Cloudflare D1 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          response_file=$(mktemp)
          runtime_secret_file=$(mktemp)
          updated_secret_file=$(mktemp)
          trap 'rm -f "$response_file" "$runtime_secret_file" "$updated_secret_file"' EXIT

          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              --output "$response_file"
            jq --exit-status '.success == true' "$response_file" >/dev/null
          elif [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Both Cloudflare D1 secrets must be configured together" >&2
            exit 1
          fi

          aws secretsmanager get-secret-value \
            --secret-id pi-digby/env \
            --query SecretString \
            --output text >"$runtime_secret_file"
          jq --compact-output \
            '. + {
              CLOUDFLARE_ACCOUNT_ID: env.CLOUDFLARE_ACCOUNT_ID,
              CLOUDFLARE_API_TOKEN: env.CLOUDFLARE_API_TOKEN
            }' \
            "$runtime_secret_file" >"$updated_secret_file"
          aws secretsmanager put-secret-value \
            --secret-id pi-digby/env \
            --secret-string "file://$updated_secret_file" >/dev/null

      # Build and push the image BEFORE CloudFormation. The task definition pins
      # the image by git SHA (ImageTag), so the SHA-tagged image must exist in
      # ECR before CloudFormation registers the task definition that references
      # it. CloudFormation then performs the single rolling deployment and waits
      # for the service to stabilise — the deployment circuit breaker rolls back
      # (and fails this job) if the new tasks never become healthy.
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update infrastructure (CloudFormation)
        run: |
          aws cloudformation deploy \
            --stack-name pi-digby \
            --template-file deploy/cloudformation.yml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              GitHubRepository=${{ github.repository }} \
              ImageTag=${{ github.sha }} \
              DesiredCount=1 \
              DatadogSite="${{ vars.DD_SITE || 'datadoghq.com' }}" \
              WikiBaseUrl="${{ vars.WIKI_BASE_URL }}"
